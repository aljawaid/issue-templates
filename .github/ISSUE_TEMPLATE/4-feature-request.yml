name: 🙏 Feature Request
description: Suggest a new feature
title: "[FEATURE] "
labels: ["enhancement"]
assignees: 'aljawaid'         # must be hardcoded
projects: ["aljawaid/5"]      # must be hardcoded
body:
- type: markdown
  attributes:
    value: "#### Remember to update and add relevant labels to this issue (at the bottom of this form)"
- type: input
  id: version
  attributes:
    label: APPLICATION VERSION
    description: |
      Go to `Settings > Business`
    placeholder: "v0.0.9"
  validations:
    required: true
- type: checkboxes
  attributes:
    label: IS THERE AN EXISTING ISSUE FOR THIS?
    description: |
      Search to see if an issue already exists to avoid duplicates. ![https://github.com/{owner}/{repo}/issues]()
    options:
    - label: I have searched the existing issues and found nothing
      required: false
- type: textarea
  attributes:
    label: FEATURE REQUESTED
    description: Provide a detailed description of the feature.
  validations:
    required: false
- type: textarea
  attributes:
    label: BUSINESS USE CASE
    description: Why is this change important? How would you use it?
    placeholder: |
      Optional
  validations:
    required: false
- type: textarea
  attributes:
    label: POSSIBLE IMPLEMENTATION IDEAS
    description: Suggest an idea for implementing addition or change.
  validations:
    required: false
- type: textarea
  attributes:
    label: SCREENSHOTS
    description: |
      Add screenshots if applicable
  validations:
    required: false
- type: textarea
  attributes:
    label: RELATED ISSUES
    description: Mention any related issues here for them to be linked. Or create sub-issues after this issue.
    placeholder: |
      #1 #152 #64
  validations:
    required: false
