name: ⚠️ Bug
description: Report a bug in the application
title: "[BUG] "
labels: ["bug"]
assignees: 'aljawaid'       # must be hardcoded
projects: ["aljawaid/5"]    # must be hardcoded
body:
- type: markdown
  attributes:
    value: "#### Remember to update and add relevant labels to this issue (at the bottom of this form)"
- type: input
  id: version
  attributes:
    label: APPLICATION VERSION
    description: |
      Go to `Settings > Business`
    placeholder: "v0.0.9"
  validations:
    required: true
- type: checkboxes
  attributes:
    label: IS THERE AN EXISTING ISSUE FOR THIS?
    description: |
      Search to see if an issue already exists to avoid duplicates. ![https://github.com/{owner}/{repo}/issues]()
    options:
    - label: I have searched the existing issues and found nothing
      required: false
- type: textarea
  attributes:
    label: CURRENT BEHAVIOUR
    description: A concise description of what you're experiencing.
  validations:
    required: false
- type: textarea
  attributes:
    label: STEPS TO REPRODUCE
    description: Steps to reproduce the behaviour.
    placeholder: |
      1. Go to '...'
      2. Click on '...'
      3. See error...
  validations:
    required: false
- type: textarea
  attributes:
    label: EXPECTED BEHAVIOUR
    description: Explain what you expected to happen.
  validations:
    required: false
- type: textarea
  attributes:
    label: SCREENSHOTS
    description: |
      Add screenshots if applicable
  validations:
    required: false
- type: textarea
  attributes:
    label: RELATED ISSUES
    description: Mention any related issues here for them to be linked. Or create sub-issues after this issue.
    placeholder: |
      #1 #152 #64
  validations:
    required: false
- type: textarea
  attributes:
    label: YOUR ENVIRONMENT
    description: |
      _Change if necessary_
    value: |
        - Operating System and version (desktop or mobile): `Windows 10 Pro` `Windows 11 Pro`
        - Browser name and version: `Firefox` _(latest)_
    render: markdown
  validations:
    required: false
